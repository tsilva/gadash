name: Production delivery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-secret-delivery
  cancel-in-progress: false

jobs:
  secrets:
    # Archived reference only. Reactivation requires an explicit policy review.
    if: ${{ false }}
    name: Check committed secrets before production delivery
    uses: ./.github/workflows/secret-scanning.yml

  deliver:
    needs: secrets
    if: ${{ false }}
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: tsilva/.github/.github/workflows/production-delivery.yml@e0c6d64d4fc917ea0e108d27ce8d1a5304aeb3c6
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
